[package]
name = "infopro-hub"
version = "0.2.1"
description = "Infopro Hub — painel de gestão para infoprodutores"
authors = ["Infopro Hub"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Atalho global ⌘+Shift+E ("Encerrar o dia") — plugin oficial, funciona com
# o app em segundo plano/sem foco.
tauri-plugin-global-shortcut = "2"

# Monitoramento de foco nativo (item 3, rodada 3) — só macOS. objc2-app-kit
# já era dependência transitiva do Tauri nessa plataforma; aqui vira direta
# só pra usar NSWorkspace/NSRunningApplication (nome do app ativo, sem
# nenhuma permissão). core-foundation é usado pro FFI manual com a
# Accessibility API (título da janela, só com permissão concedida — ver
# src/active_window.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
core-foundation = "0.10"
