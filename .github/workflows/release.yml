name: Release desktop app

# Dispara ao empurrar uma tag de versão (ex.: v0.1.1) — build, assina
# (via TAURI_SIGNING_PRIVATE_KEY/_PASSWORD, secrets do repo) e publica no
# GitHub Releases (instaladores + latest.json que o updater consulta). Ver
# docs/DESKTOP.md pro passo a passo de configuração dos secrets.
on:
  push:
    tags:
      - "v*"

# Necessário pro GITHUB_TOKEN poder criar/editar a release.
permissions:
  contents: write

jobs:
  release:
    # Mac e Windows em paralelo, publicando na mesma release (o tauri-action
    # junta os instaladores e o latest.json do auto-update). fail-fast: false
    # — se um falhar, o outro ainda publica.
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do frontend
        run: npm install --include=optional

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Infopro Hub Desktop ${{ github.ref_name }}"
          releaseBody: "Mac: baixe o .dmg, abra e, na primeira vez, clique com o botão direito no app → Abrir (ainda não notarizado pela Apple). Windows: baixe o instalador .exe; se o Windows avisar \"aplicativo não reconhecido\", clique em Mais informações → Executar assim mesmo (ainda sem certificado de assinatura)."
          releaseDraft: false
          prerelease: false
